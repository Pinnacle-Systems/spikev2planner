name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        # Added --legacy-peer-deps to prevent peer dependency conflicts
        run: npm ci --prefix client --legacy-peer-deps

      - name: Build frontend
        env:
          # Pass any REACT_APP_* variables needed at build time:
          REACT_APP_SERVER_URL: ${{ secrets.REACT_APP_SERVER_URL }}
        run: CI=false npm run build --prefix client

      - name: Verify frontend build output
        # Changed dist to build
        run: |
          echo "Verifying client/build contents:"
          ls -la client/build

      - name: Deploy backend source to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-az --stats"
          # Only include files that actually exist in your spike_v2 root:
          SOURCE: package.json package-lock.json server.js src prisma client/package.json
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}/
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.REMOTE_TARGET }}
            mkdir -p ${{ secrets.REMOTE_TARGET }}/client/build

      - name: Deploy frontend build artifacts to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-az --delete --stats"
          # Changed dist/ to build/
          SOURCE: client/build/
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}/client/build/

      - name: Run remote install, migrate, and restart on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu

            . ~/.nvm/nvm.sh
            nvm install 24
            nvm use 24

            cd ${{ secrets.REMOTE_TARGET }}

            # 1. Install production-only backend packages
            npm ci --omit=dev

            # 2. Prisma generation & migration
            npx prisma generate
            npx prisma migrate deploy

            # 3. Restart PM2 application
            pm2 reload spike-api --update-env || pm2 start server.js --name spike-api
